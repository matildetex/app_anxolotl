allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

subprojects {
    def configureProject = { project ->
        if (project.hasProperty('android')) {
            project.android {
                if (namespace == null) {
                    namespace project.group ?: "com.example.${project.name.replace("-", "_")}"
                }
            }
        }
    }

    if (it.state.executed) {
        configureProject(it)
    } else {
        it.afterEvaluate { configureProject(it) }
    }
}